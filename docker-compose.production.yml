name: core-base

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - core_base_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [core_base]

  migration:
    image: ${MIGRATION_IMAGE:?set MIGRATION_IMAGE}
    env_file: [backend.production.env]
    command: ["sh", "-c", "pnpm db:migrate:deploy && node dist/jobs-install.js"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    networks: [core_base]

  api:
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE}
    env_file: [backend.production.env]
    ports: ["127.0.0.1:4001:4000"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      migration: { condition: service_completed_successfully }
    restart: unless-stopped
    networks: [core_base]

  worker:
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE}
    env_file: [backend.production.env]
    command: ["node", "dist/worker.js"]
    depends_on:
      migration: { condition: service_completed_successfully }
    restart: unless-stopped
    networks: [core_base]

  frontend:
    image: ${FRONTEND_IMAGE:?set FRONTEND_IMAGE}
    ports: ["127.0.0.1:3001:3000"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: [api]
    restart: unless-stopped
    networks: [core_base]

volumes:
  core_base_postgres:

networks:
  core_base:
    driver: bridge
