services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: corestack
      POSTGRES_USER: corestack
      POSTGRES_PASSWORD: corestack
    ports:
      - "5432:5432"
    volumes:
      - corestack_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corestack -d corestack"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  corestack_postgres:
