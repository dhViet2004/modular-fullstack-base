name: Publish images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: migration
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/core-base-migration:sha-${{ github.event.workflow_run.head_sha }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/core-base-backend:sha-${{ github.event.workflow_run.head_sha }}
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://core.hviet.info.vn/api/v1
            NEXT_PUBLIC_API_ORIGIN=https://core.hviet.info.vn
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/core-base-frontend:sha-${{ github.event.workflow_run.head_sha }}
